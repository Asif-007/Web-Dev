<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="name">Name:</label>
      <input type="text" name="userName" id="name" />
      <br /><br />
      <label for="fname">Father Name:</label>
      <input type="text" name="userFname" id="fname" />
      <br /><br />
      <label for="age">Age</label>
      <input type="age" name="userAge" name="age" />
      <br /><br />
      <label for="pass">Password</label>
      <input type="password" name="userPassword" name="pass" />
      <br /><br />
      <label for="male">Male</label>
      <input type="radio" name="gender" id="male" value="Male" />
      <label for="female">Female</label>
      <input type="radio" name="gender" id="female" value="Female" />
      <label for="others">Others</label>
      <input type="radio" name="gender" id="others" value="Others" />

      <br /><br />
      <label for="c++">C++</label>
      <input type="checkbox" name="subject" id="c++" value="C++" />
      <label for="java">Java</label>
      <input type="checkbox" name="subject" id="java" value="Java" />
      <label for="js">JavaScript</label>
      <input type="checkbox" name="subject" id="js" value="JavaScript" />
      <br /><br />
      <input type="submit" />
      <br /><br />
    </form>
  </body>
</html>
