<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr />
    <h2>Personal Details</h2>
    <form action="">
      <label for="fname">First Name:</label>
      <input type="text" placeholder="e.g., Arjun" id="fname" name="fname" />
      <br /><br />
      <label for="lname">Last Name:</label>
      <input type="text" placeholder="e.g., Kumar" name="lname" id="lname" />
      <br /><br />
      <label for="dob">Date of Birth:</label>
      <input type="date" name="dob" id="dob" />
      <br /><br />
      <h3>Gender</h3>
      <input type="radio" name="gender" id="male" value="Male" />
      <label for="male">Male</label>
      <br />
      <input type="radio" name="gender" id="female" value="Female" />
      <label for="male">Female</label>
      <br />
      <input type="radio" name="gender" id="other" value="Others" />
      <label for="others">Others</label>
      <br /><br />
      <h3>Upload Your Photo</h3>
      <input type="file" name="file" />
      <br />
      <br />
      <hr />
      <h2>Contact Information</h2>
      <label for="email">Email Address:</label>
      <input
        type="text"
        name="email"
        id="email"
        placeholder="you@example.com"
      />
      <br /><br />
      <label for="phone">Phone Number:</label>
      <input
        type="number"
        name="number"
        id="phone"
        placeholder="e.g., 8121066786"
      />
      <br /><br />
      <label for="address">Mailing Address:</label>
      <br />
      <textarea name="address" id="address"></textarea>
      <br /><br />
      <hr />
      <h2>Academic Information</h2>
      <label for="course">Select Your Course:</label>
      <br />
      <select name="course" id="course">
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
      </select>
      <h3>Extracurricular Activities:</h3>
      <label for=""></label>
      <input type="checkbox">
      <br><br>
    </form>
  </body>
</html>
